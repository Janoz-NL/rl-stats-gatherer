# MQTT
mp.messaging.incoming.rlapi.connector=smallrye-mqtt
mp.messaging.incoming.rlapi.topic=rlapi2mqtt/updatestate
mp.messaging.incoming.rlapi.client-id=${MQTT_CLIENT_ID:rl_stats_gatherer}

%prod.mp.messaging.incoming.rlapi.host=${MQTT_HOST}
%prod.mp.messaging.incoming.rlapi.ssl=${MQTT_SSL:false}
%prod.mp.messaging.incoming.rlapi.port=${MQTT_PORT:1883}
%prod.mp.messaging.incoming.rlapi.username=${MQTT_USERNAME}
%prod.mp.messaging.incoming.rlapi.password=${MQTT_PASSWORD}

# Database
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:rlstats}
%prod.quarkus.datasource.jdbc.url=jdbc:${quarkus.datasource.reactive.url}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}